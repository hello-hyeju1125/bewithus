<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>대치위더스 SEO 메타 태그 참고</title>
    <!--
      이 파일은 검색엔진 등록 시 참고용입니다.
      실제 사이트에는 Next.js app/layout.tsx 가 동일한 메타를 자동 출력합니다.
      {SITE_URL} 을 실제 배포 도메인으로 바꿔 사용하세요.
    -->

    <!-- 기본 -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>대치위더스</title>
    <meta
      name="description"
      content="대치위더스는 대치동에서 결과로 증명하는 프리미엄 입시 전문 학원입니다. 대원외고·한영외고·일반고·중등 맞춤 시간표와 강사진, 설명회 안내."
    />
    <meta
      name="keywords"
      content="대치위더스,대치동 학원,입시 학원,대원외고 학원,한영외고 학원,외고 학원,중등 학원,고등 학원,대치동 입시"
    />
    <meta name="author" content="대치위더스" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="{SITE_URL}/" />

    <!-- Open Graph (카카오·페이스북 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="대치위더스" />
    <meta property="og:title" content="대치위더스" />
    <meta
      property="og:description"
      content="대치위더스는 대치동에서 결과로 증명하는 프리미엄 입시 전문 학원입니다."
    />
    <meta property="og:url" content="{SITE_URL}/" />
    <meta property="og:image" content="{SITE_URL}/asset/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="대치위더스" />
    <meta
      name="twitter:description"
      content="대치위더스는 대치동에서 결과로 증명하는 프리미엄 입시 전문 학원입니다."
    />
    <meta name="twitter:image" content="{SITE_URL}/asset/logo.png" />

    <!-- RSS -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="대치위더스 공지사항"
      href="{SITE_URL}/feed.xml"
    />

    <!-- 검색엔진 소유권 확인 (각 포털에서 발급받은 값으로 교체) -->
    <meta name="google-site-verification" content="GOOGLE_VERIFICATION_CODE" />
    <meta name="naver-site-verification" content="NAVER_VERIFICATION_CODE" />
    <meta name="daum-site-verification" content="DAUM_VERIFICATION_CODE" />
  </head>
  <body>
    <p>참고용 파일입니다. 브라우저에서 직접 열지 않아도 됩니다.</p>
  </body>
</html>
